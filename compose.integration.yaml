name: epay-bridge-integration

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: epay_integration
      POSTGRES_USER: epay
      POSTGRES_PASSWORD: epay-integration-test-password
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epay -d epay_integration"]
      interval: 2s
      timeout: 2s
      retries: 30
    security_opt:
      - no-new-privileges:true

